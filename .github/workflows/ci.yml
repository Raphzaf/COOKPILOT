name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Seed SQL is up to date with the TypeScript seed data
        run: npm run db:seed:generate && git diff --exit-code database/seeds
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (demo mode, production build)
        run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
